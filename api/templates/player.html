<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>Nava VHF</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: #0f1f36;
      --panel-2: #132845;
      --line: #1f3b60;
      --text: #e6eef8;
      --muted: #8aa0b8;
      --cyan: #4fd1ff;
      --amber: #ffb547;
      --green: #4ade80;
      --red: #ff6b6b;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 0 14px 40px; }

    /* ---- header photo ---- */
    .hero {
      position: relative;
      height: clamp(240px, 42vw, 300px);
      max-width: 640px;
      margin: 0 auto;
      background:
        linear-gradient(180deg, rgba(7,17,31,0) 0%, rgba(7,17,31,0.1) 45%, rgba(7,17,31,0.75) 82%, var(--bg) 100%),
        url("/radio/static/hero.jpg") center 4% / cover no-repeat,
        radial-gradient(ellipse at 70% 20%, #1b3b6b 0%, #0b1d3a 45%, var(--bg) 100%);
    }
    .hero-bar {
      position: absolute; left: 16px; right: 16px; bottom: 14px;
      max-width: 612px; margin: 0 auto;
      display: flex; align-items: flex-end; justify-content: space-between; gap: 10px;
    }
    .brand { font-size: 26px; font-weight: 800; letter-spacing: 0.06em; text-shadow: 0 2px 12px rgba(0,0,0,0.6); }
    .brand small { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.18em; color: var(--muted); }
    .brand .place, .title .place {
      display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.2em;
      color: var(--cyan); margin-bottom: 4px; text-shadow: 0 1px 8px rgba(0,0,0,0.8);
    }
    .brand small.tagline, .title small.tagline { font-style: italic; letter-spacing: 0.03em; font-size: 13px; font-weight: 500; color: #b9c8da; margin-top: 3px; }
    .pill {
      font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: 0.12em;
      padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line);
      background: rgba(7,17,31,0.75); color: var(--muted); white-space: nowrap;
    }
    .pill::before { content: "●"; margin-right: 6px; }
    .pill.listen { color: var(--cyan); border-color: var(--cyan); }
    .pill.scan   { color: var(--cyan); border-color: var(--cyan); }
    .pill.scan::before { animation: blink 1s steps(2) infinite; }
    .pill.locked { color: var(--amber); border-color: var(--amber); }
    .pill.error  { color: var(--red); border-color: var(--red); }
    @keyframes blink { 50% { opacity: 0.2; } }

    /* ---- main readout ---- */
    .readout {
      margin-top: 4px;
      background: linear-gradient(160deg, var(--panel-2), var(--panel));
      border: 1px solid var(--line); border-radius: 14px; padding: 16px;
      transition: box-shadow 0.3s, border-color 0.3s;
    }
    .readout.on { border-color: var(--cyan); box-shadow: 0 0 22px rgba(79,209,255,0.18); }
    .readout.locked { border-color: var(--amber); box-shadow: 0 0 22px rgba(255,181,71,0.25); }
    .readout.locked .ro-ch { color: var(--amber); }
    .ro-top { display: flex; align-items: baseline; gap: 12px; }
    .ro-ch { font-family: var(--mono); font-size: 44px; font-weight: 800; line-height: 1; }
    .ro-ch.dim { color: #34506f; }
    .ro-name { font-size: 16px; font-weight: 600; }
    .ro-freq { font-family: var(--mono); color: var(--cyan); font-size: 15px; margin-top: 2px; }
    .ro-status { color: var(--muted); font-size: 14px; margin-top: 10px; min-height: 18px; }
    .turn { font-size: 12px; color: var(--muted); margin-top: 6px; font-family: var(--mono); min-height: 15px; }
    .turn.mine { color: var(--green); }
    .turn.theirs { color: var(--amber); }
    .queued {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      margin-top: 10px; padding: 8px 10px; border-radius: 10px; font-size: 13px;
      border: 1px dashed var(--amber); color: var(--amber); background: rgba(255,181,71,0.07);
    }
    .queued[hidden] { display: none; }
    .q-actions { display: flex; gap: 6px; flex: none; }
    .mini {
      font: inherit; font-size: 12px; font-weight: 700; color: var(--text); background: var(--panel);
      border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; cursor: pointer;
    }
    .toast { color: var(--amber); }
    audio#radio { width: 100%; height: 36px; margin-top: 12px; }

    /* ---- transport ---- */
    .transport { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .btn {
      font: inherit; font-size: 15px; font-weight: 700; color: var(--text);
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
      padding: 12px 6px; cursor: pointer;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.35; cursor: default; }
    .btn.primary { border-color: var(--cyan); color: var(--cyan); }
    .btn.warn { border-color: var(--amber); color: var(--amber); }

    /* ---- channel grid ---- */
    h2 {
      font-size: 12px; letter-spacing: 0.18em; color: var(--muted); font-weight: 700;
      margin: 22px 2px 8px; display: flex; justify-content: space-between; align-items: center;
    }
    h2 a { color: var(--cyan); text-decoration: none; letter-spacing: 0.05em; font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .card {
      position: relative; background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; padding: 12px 12px 10px; cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .card.active { border-color: var(--cyan); box-shadow: 0 0 16px rgba(79,209,255,0.22); }
    .card.scanning { border-color: rgba(79,209,255,0.5); }
    .card.locked { border-color: var(--amber); box-shadow: 0 0 16px rgba(255,181,71,0.25); }
    .card.open { grid-column: 1 / -1; cursor: default; }
    .c-num { font-family: var(--mono); font-size: 26px; font-weight: 800; line-height: 1; }
    .c-name { font-size: 13px; color: var(--text); margin-top: 4px; min-height: 16px;
              line-height: 1.3; padding-right: 6px; }
    .c-heard { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .c-tags { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; }
    .tag { font-size: 11px; line-height: 1.3; color: #b9c8da; padding-left: 8px; border-left: 2px solid var(--cyan); }
    .ro-tags { font-size: 12px; color: #b9c8da; margin-top: 4px; }
    .ro-tags:empty { display: none; }
    .c-heard.recent { color: var(--green); }
    .c-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
    .scan-toggle {
      display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
      padding: 4px 8px; border: 1px solid var(--line); border-radius: 999px; user-select: none;
    }
    .scan-toggle input { accent-color: var(--cyan); margin: 0; }
    .scan-toggle:has(input:checked) { color: var(--cyan); border-color: rgba(79,209,255,0.6); }
    .gear {
      position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 8px;
      border: 1px solid transparent; background: transparent; color: var(--muted); font-size: 16px; cursor: pointer;
    }
    .card.open .gear { border-color: var(--line); color: var(--cyan); }
    .settings { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
    .card.open .settings { display: block; }
    .slider-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
    .sensitivity-slider { width: 100%; accent-color: var(--cyan); margin: 8px 0 4px; }
    .sensitivity-readout { font-size: 13px; color: var(--text); }

    /* ---- recent clips ---- */
    .clips { display: flex; flex-direction: column; gap: 6px; }
    .clip {
      display: flex; align-items: center; gap: 10px; background: var(--panel);
      border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
    }
    .clip-play {
      flex: none; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--cyan);
      background: transparent; color: var(--cyan); font-size: 14px; cursor: pointer;
    }
    .clip.playing .clip-play { background: var(--cyan); color: var(--bg); }
    .clip-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-right: -2px; }
    .clip.unheard .clip-dot { background: var(--cyan); }
    .clip-main { flex: 1; min-width: 0; }
    .clip-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .clip-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .sig { font-family: var(--mono); font-size: 12px; flex: none; }
    .sig.weak { color: var(--amber); } .sig.good { color: var(--cyan); } .sig.strong { color: var(--green); }
    .tools { display: flex; gap: 8px; }
    .tools a { flex: 1; text-align: center; color: var(--cyan); text-decoration: none; font-weight: 700; font-size: 14px;
               background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 6px; }
    .empty { color: var(--muted); font-size: 14px; padding: 12px 2px; }
  </style>
</head>
<body>
  <div class="hero">
    <div class="hero-bar">
      <div class="brand"><span class="place">ST. AUGUSTINE, FL</span>⚓ NAVA VHF<small class="tagline">Live from onboard SV Nava</small></div>
      <div id="pill" class="pill">IDLE</div>
    </div>
  </div>

  <div class="wrap">
    <div id="readout" class="readout">
      <div class="ro-top">
        <div id="roCh" class="ro-ch dim">--</div>
        <div>
          <div id="roName" class="ro-name">Not tuned</div>
          <div id="roFreq" class="ro-freq">--- --- MHz</div>
          <div id="roTags" class="ro-tags"></div>
        </div>
      </div>
      <div id="status" class="ro-status">Tap a channel to listen, or start a scan.</div>
      <div id="turn" class="turn"></div>
      <div id="queued" class="queued" hidden>
        <span id="queuedText"></span>
        <span class="q-actions">
          <button class="mini" onclick="usePin()">PIN</button>
          <button class="mini" onclick="cancelQueued()">Cancel</button>
        </span>
      </div>
      <audio id="radio" controls preload="none"></audio>
    </div>

    <div class="transport">
      <button id="stopButton" class="btn" onclick="stopAll()">■ Stop</button>
      <button id="btn-start-scan" class="btn primary" onclick="startScan()">⟳ Scan</button>
      <button id="btn-resume-scan" class="btn warn" onclick="resumeScan()" disabled>▶ Resume</button>
    </div>

    <h2>CHANNELS</h2>
    <div id="grid" class="grid"></div>

    <h2>RECENT TRANSMISSIONS <a href="/radio/recordings/view">All recordings →</a></h2>
    <div id="clips" class="clips"><div class="empty">Loading…</div></div>

    <h2>TOOLS</h2>
    <div class="tools">
      <a href="/radio/recordings/view">Recordings</a>
      <a href="/radio/ais/view">Ship map</a>
      <a href="/radio/noise/view">Antenna noise meter</a>
    </div>
    <audio id="clipAudio" preload="none"></audio>
  </div>

<script>
  const channels = __CHANNELS__;   // {key: {name, mhz}}
  // Explicit order: Object.keys() would put "13","16"... (array-index-like)
  // before "09" (leading zero) and "wx".
  const channelOrder = __CHANNEL_ORDER__;
  const audio = document.getElementById("radio");
  const clipAudio = document.getElementById("clipAudio");
  const statusEl = document.getElementById("status");
  const scanStartBtn = document.getElementById("btn-start-scan");
  const scanResumeBtn = document.getElementById("btn-resume-scan");

  // The radio is shared: the server's *selection* is the truth, and this page
  // follows it. wantAudio = this person wants to hear whatever is selected.
  let selection = { mode: "idle", channel: null };
  let ctl = null;              // control block from /radio/status
  let wantAudio = false;
  let lastHeard = {};
  let notice = null;           // {text, until} - transient message that beats the default status line

  const clientId = (() => {
    let id = null;
    try { id = localStorage.getItem("navaos_client"); } catch (e) {}
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now());
      try { localStorage.setItem("navaos_client", id); } catch (e) {}
    }
    return id;
  })();
  function savedPin() { try { return localStorage.getItem("navaos_pin"); } catch (e) { return null; } }
  function savePin(p) { try { localStorage.setItem("navaos_pin", p); } catch (e) {} }
  function forgetPin() { try { localStorage.removeItem("navaos_pin"); } catch (e) {} }

  // ---------- rendering helpers ----------

  function shortName(key) {
    // "Channel 09 - Bridge of Lions" -> "Bridge of Lions"; "Channel 68" -> ""
    const n = channels[key].name;
    const m = n.match(/^Channel\s+\S+\s*-\s*(.+)$/);
    if (m) return m[1];
    if (/^Channel\s+\S+$/.test(n)) return "";
    return n;
  }
  function label(key) { return key === "wx" ? "WX" : key; }

  function ago(ts) {
    const s = Math.max(0, Date.now() / 1000 - ts);
    if (s < 60) return "just now";
    if (s < 3600) return Math.round(s / 60) + " min ago";
    if (s < 86400) return Math.round(s / 3600) + " h ago";
    return Math.round(s / 86400) + " d ago";
  }

  function setStatus(text) { statusEl.innerText = text; }

  function setPill(text, cls) {
    const p = document.getElementById("pill");
    p.className = "pill " + (cls || "");
    p.innerText = text;
  }

  function setReadout(key, state) {
    const ro = document.getElementById("readout");
    ro.className = "readout " + (state || "");
    const ch = document.getElementById("roCh");
    if (!key) {
      ch.innerText = "--"; ch.classList.add("dim");
      document.getElementById("roName").innerText = "Not tuned";
      document.getElementById("roFreq").innerText = "--- --- MHz";
      document.getElementById("roTags").textContent = "";
      return;
    }
    ch.innerText = label(key); ch.classList.remove("dim");
    document.getElementById("roName").innerText = shortName(key) || "Channel " + key;
    document.getElementById("roFreq").innerText = channels[key].mhz;
    const mb = channels[key].monitored_by || [];
    document.getElementById("roTags").textContent = mb.length ? "Monitored by " + mb.join(" · ") : "";
  }

  function markCards(key, cls) {
    document.querySelectorAll(".card").forEach(c => c.classList.remove("active", "scanning", "locked"));
    if (key) {
      const c = document.getElementById("card-" + key);
      if (c) c.classList.add(cls);
    }
  }

  function buildGrid() {
    const grid = document.getElementById("grid");
    grid.innerHTML = channelOrder.map(key => `
      <div class="card" id="card-${key}" onclick="onCardTap(event, '${key}')">
        <button class="gear" title="Squelch sensitivity" onclick="event.stopPropagation(); toggleSettings('${key}')">⚙</button>
        <div class="c-num">${label(key)}</div>
        <div class="c-name">${shortName(key) || channels[key].mhz}</div>
        ${(channels[key].monitored_by || []).length ? `<div class="c-tags">${channels[key].monitored_by.map(m => `<span class="tag">Monitored by ${m}</span>`).join("")}</div>` : ""}
        <div class="c-heard" id="heard-${key}">—</div>
        <div class="c-row">
          <label class="scan-toggle" onclick="event.stopPropagation()">
            <input type="checkbox" class="scan-checkbox" data-channel="${key}"
                   onchange="toggleScanChannel('${key}', this.checked)"> scan
          </label>
        </div>
        <div class="settings" onclick="event.stopPropagation()">
          <div class="slider-labels"><span>Sensitive</span><span>Strict</span></div>
          <input type="range" min="0" max="100" value="50" class="sensitivity-slider"
                 data-channel="${key}" oninput="onSensitivityInput('${key}', this.value)">
          <div class="sensitivity-readout">Sensitivity: <span id="sens-label-${key}">—</span></div>
        </div>
      </div>`).join("");
  }

  function onCardTap(ev, key) {
    if (document.getElementById("card-" + key).classList.contains("open")) return;
    playRadio(key);
  }

  // ---------- last heard + recent clips ----------

  function renderLastHeard() {
    for (const key of Object.keys(channels)) {
      const el = document.getElementById("heard-" + key);
      if (!el) continue;
      const h = lastHeard[key];
      if (!h) { el.innerText = "not heard yet"; el.classList.remove("recent"); continue; }
      el.innerText = "heard " + ago(h.ts);
      el.classList.toggle("recent", Date.now() / 1000 - h.ts < 600);
    }
  }

  function sigClass(db) { return db === null ? "" : db < 15 ? "weak" : db < 30 ? "good" : "strong"; }

  async function loadActivity() {
    try {
      lastHeard = await (await fetch("/radio/recordings/last-heard?x=" + Date.now())).json();
      renderLastHeard();
    } catch (e) {}
    if (!clipAudio.paused) return;   // don't redraw under a clip that's playing
    try {
      const clips = await (await fetch("/radio/recordings?limit=5&x=" + Date.now())).json();
      const el = document.getElementById("clips");
      if (!clips.length) { el.innerHTML = '<div class="empty">No transmissions recorded yet.</div>'; return; }
      el.innerHTML = clips.map(c => `
        <div class="clip${c.listened === false ? " unheard" : ""}" data-src="/radio/recordings/file/${c.path}" data-path="${c.path}">
          <span class="clip-dot"></span>
          <button class="clip-play" onclick="playClip(this)">▶</button>
          <div class="clip-main">
            <div class="clip-title">Ch ${label(c.channel)}${shortName(c.channel) ? " · " + shortName(c.channel) : ""}</div>
            <div class="clip-sub">${ago(c.ts)} · ${c.duration_s.toFixed(1)} s</div>
          </div>
          <div class="sig ${sigClass(c.peak_rf_snr_db)}">${c.peak_rf_snr_db === null ? "" : "+" + c.peak_rf_snr_db + " dB"}</div>
        </div>`).join("");
    } catch (e) {}
  }

  function playClip(btn) {
    const row = btn.closest(".clip");
    const src = row.dataset.src;
    const wasThis = row.classList.contains("playing");
    document.querySelectorAll(".clip").forEach(r => { r.classList.remove("playing"); r.querySelector(".clip-play").innerText = "▶"; });
    if (wasThis && !clipAudio.paused) { clipAudio.pause(); return; }
    clipAudio.src = src;
    clipAudio.play().then(() => { row.classList.add("playing"); btn.innerText = "❚❚"; }).catch(() => {});
  }
  // Played to the end = heard (shared with the recordings page).
  function markHeard(row) {
    if (!row || !row.classList.contains("unheard")) return;
    row.classList.remove("unheard");
    fetch("/radio/recordings/listened", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ paths: [row.dataset.path] }) }).catch(() => {});
  }
  clipAudio.ontimeupdate = () => {
    if (clipAudio.duration && clipAudio.currentTime / clipAudio.duration >= 0.9) markHeard(document.querySelector(".clip.playing"));
  };
  clipAudio.onended = () => {
    markHeard(document.querySelector(".clip.playing"));
    document.querySelectorAll(".clip").forEach(r => { r.classList.remove("playing"); r.querySelector(".clip-play").innerText = "▶"; });
  };

  // ---------- talking to the shared radio ----------

  function say(text, seconds) { notice = { text, until: Date.now() + (seconds || 6) * 1000 }; setStatus(text); }

  function fmt(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); }

  function describe(action, channel) {
    if (action === "tune") return "Ch " + label(channel);
    if (action === "scan") return "Scan";
    if (action === "stop") return "Stop";
    return action;
  }

  async function control(action, channel, pin) {
    const body = { action, channel: channel || null, client: clientId, pin: pin || savedPin() || null };
    let res;
    try {
      res = await fetch("/radio/control", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    } catch (e) { say("Network error - try again."); return null; }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      if (res.status === 403 && !pin) forgetPin();          // remembered PIN went stale
      say(data.detail || "That didn't work.");
      return null;
    }
    if (pin) savePin(pin);
    applyStatus(data);
    return data;
  }

  async function settingsFetch(url, opts) {
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers || {});
    const pin = savedPin();
    if (pin) opts.headers["X-Override-Pin"] = pin;
    const sep = url.includes("?") ? "&" : "?";
    const res = await fetch(url + sep + "client=" + encodeURIComponent(clientId), opts);
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      say(d.detail || "Couldn't change that setting.", 8);
      throw new Error("refused");
    }
    return res;
  }

  // ---------- following the radio ----------

  function wantedSrc() {
    if (!wantAudio) return null;
    if (selection.mode === "direct" && selection.channel) return "/radio/stream/" + selection.channel + ".mp3";
    if (selection.mode === "scan") return "/radio/scan/stream.mp3";
    return null;
  }

  function resetAudio() {
    audio.pause();
    audio.removeAttribute("src");
    audio.load();
  }

  // (Re)attach audio only when what the radio is playing changes, or when
  // forced (user tap / dropped stream). A user who paused the audio bar
  // (e.g. from the lock screen) stays paused.
  async function syncAudio(force) {
    const want = wantedSrc();
    const have = (audio.getAttribute("src") || "").split("?")[0];
    if (!want) { if (have) resetAudio(); return; }
    if (want === have && !force) return;
    audio.src = want + "?client=" + encodeURIComponent(clientId) + "&t=" + Date.now();
    audio.load();
    try { await audio.play(); }
    catch (e) { setStatus("Tap ▶ on the audio bar to start listening."); }
  }

  function applyStatus(d) {
    const prevSel = JSON.stringify(selection);
    selection = d.selection || { mode: "idle", channel: null };
    ctl = d.control || null;
    const changedByOther = prevSel !== JSON.stringify(selection) && ctl && !ctl.last_change_by_you && prevSel !== '{"mode":"idle","channel":null}';
    render(d);
    if (changedByOther && ctl.last_change_default) say("No activity for 20 min - back to scanning all channels.", 10);
    else if (changedByOther && wantAudio) say("Another listener changed the radio.", 6);
    syncAudio();
  }

  function render(d) {
    const sel = selection;
    // pill + readout + cards
    if (sel.mode === "scan" && ctl && ctl.ais_active) {
      setPill("AIS " + fmt(ctl.ais_remaining_s), "scan"); setReadout(null); markCards(null);
      defaultStatus("Briefly listening for ship positions (Ship map) - scanning resumes in " + fmt(ctl.ais_remaining_s) + ". Tap anything to take the radio back now.");
      scanResumeBtn.disabled = true;
    } else if (sel.mode === "scan") {
      const key = d.current_channel;
      if (d.locked) {
        setPill("LOCKED", "locked"); setReadout(key, "locked"); markCards(key, "locked");
        defaultStatus("Traffic on " + label(key) + " - holding. Resume to keep scanning.");
      } else {
        setPill("SCANNING", "scan"); setReadout(key, "on"); markCards(key, "scanning");
        defaultStatus("Scanning - will stop on the first transmission.");
      }
      scanResumeBtn.disabled = !d.locked;
    } else if (sel.mode === "direct") {
      setPill(wantAudio ? "LISTENING" : "TUNED", "listen");
      setReadout(sel.channel, "on"); markCards(sel.channel, "active");
      defaultStatus(wantAudio ? "Listening - audio opens when someone transmits." : "Radio is on " + label(sel.channel) + " - tap it to listen.");
      scanResumeBtn.disabled = true;
    } else if (sel.mode === "noise") {
      setPill("NOISE METER", "scan"); setReadout(null); markCards(null);
      defaultStatus("The radio is running the antenna noise meter (Noise meter page below).");
      scanResumeBtn.disabled = true;
    } else {
      setPill("IDLE"); setReadout(null); markCards(null);
      defaultStatus("Tap a channel to listen, or start a scan.");
      scanResumeBtn.disabled = true;
    }
    scanStartBtn.innerText = sel.mode !== "scan" ? "⟳ Scan" : (wantAudio ? "■ Stop scan" : "▶ Join scan");

    // whose turn
    const turn = document.getElementById("turn");
    if (!ctl || sel.mode === "idle" && !ctl.turn_active) { turn.className = "turn"; turn.innerText = ""; }
    else if (ctl.turn_active && ctl.yours) { turn.className = "turn mine"; turn.innerText = "● You have the radio · " + fmt(ctl.turn_remaining_s) + " left"; }
    else if (ctl.turn_active) { turn.className = "turn theirs"; turn.innerText = "● Another listener has the radio · " + fmt(ctl.turn_remaining_s) + " left"; }
    else { turn.className = "turn"; turn.innerText = "○ Open - anyone can change it"; }
    const n = ctl ? ctl.listeners : 0;
    if (n > 1) turn.innerText += " · " + n + " listening";
    if (ctl && ctl.default_scan_in_s !== null && ctl.default_scan_in_s !== undefined && ctl.default_scan_in_s < 1200 && !ctl.pending) {
      turn.innerText += (turn.innerText ? " · " : "") + "default scan in " + fmt(ctl.default_scan_in_s);
    }

    // my queued request
    const q = document.getElementById("queued");
    const p = ctl && ctl.pending;
    if (p && p.yours) {
      q.hidden = false;
      document.getElementById("queuedText").innerText = describe(p.action, p.channel) + " is next - starts in " + fmt(p.applies_in_s);
    } else {
      q.hidden = true;
    }
  }

  function defaultStatus(text) {
    if (notice && Date.now() < notice.until) return;   // a fresh message wins for a few seconds
    notice = null;
    setStatus(text);
  }

  async function pollStatus() {
    try {
      const d = await (await fetch("/radio/status?client=" + encodeURIComponent(clientId) + "&x=" + Date.now())).json();
      applyStatus(d);
    } catch (e) {}
  }

  // ---------- user actions ----------

  async function playRadio(channel) {
    const joining = selection.mode === "direct" && selection.channel === channel;
    wantAudio = true;
    const r = await control("tune", channel);
    if (r && r.result === "joined") syncAudio(joining && audio.paused);
    if (r && r.result === "queued") say("Another listener has the radio - your pick is queued. You're hearing their choice meanwhile.", 8);
  }

  async function startScan() {
    if (selection.mode === "scan" && !wantAudio) { wantAudio = true; return syncAudio(true).then(pollStatus); }   // Join
    if (selection.mode === "scan") return stopAll();
    wantAudio = true;
    const r = await control("scan");
    if (r && r.result === "queued") say("Another listener has the radio - your scan is queued.", 8);
  }

  async function resumeScan() { await control("resume"); }

  async function stopAll() {
    const r = await control("stop");
    if (r && r.result === "queued") { say("Another listener has the radio - Stop is queued. Pause the audio bar to stop just your own audio.", 9); return; }
    if (r) { wantAudio = false; resetAudio(); applyStatus(r); }
  }

  async function cancelQueued() { await control("cancel"); say("Request cancelled."); }

  async function usePin() {
    const p = ctl && ctl.pending;
    const pin = window.prompt("Override PIN");
    if (!pin) return;
    const r = await control(p ? p.action : "tune", p ? p.channel : selection.channel, pin.trim());
    if (r) say("Override applied.");
  }

  async function toggleScanChannel(channel, included) {
    const endpoint = included ? "/radio/scan/channels/add" : "/radio/scan/channels/remove";
    try {
      await settingsFetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ channel: channel }),
      });
    } catch (err) { loadScanChannels(); }   // refused: put the checkbox back
  }

  async function loadScanChannels() {
    try {
      const d = await (await fetch("/radio/scan/channels?x=" + Date.now())).json();
      const included = new Set(d.channels || []);
      document.querySelectorAll(".scan-checkbox").forEach(c => { c.checked = included.has(c.dataset.channel); });
    } catch (err) {}
  }

  // ---------- per-channel squelch sensitivity ----------
  // RF squelch thresholds, dB above the band noise floor (empty channel
  // ~0 dB, noise peaks ~+1.3). Sensitive = opens on weaker signals.
  const SENSITIVITY_MIN_DB = 4.0;
  const SENSITIVITY_MAX_DB = 16.0;
  const CLOSE_THRESHOLD_OFFSET_DB = 4.0;
  const CLOSE_THRESHOLD_MIN_DB = 3.0;
  const sensitivityDebounceTimers = {};

  function toggleSettings(channel) {
    document.getElementById("card-" + channel).classList.toggle("open");
  }

  function sliderToParams(value) {
    const v = Number(value);
    const rf_open_threshold_db = SENSITIVITY_MIN_DB + (v / 100) * (SENSITIVITY_MAX_DB - SENSITIVITY_MIN_DB);
    const rf_close_threshold_db = Math.max(CLOSE_THRESHOLD_MIN_DB, rf_open_threshold_db - CLOSE_THRESHOLD_OFFSET_DB);
    return { rf_open_threshold_db, rf_close_threshold_db };
  }

  function openThresholdToSlider(db) {
    const c = Math.max(SENSITIVITY_MIN_DB, Math.min(SENSITIVITY_MAX_DB, db));
    return Math.round((c - SENSITIVITY_MIN_DB) / (SENSITIVITY_MAX_DB - SENSITIVITY_MIN_DB) * 100);
  }

  function updateSensitivityLabel(channel, value) {
    const el = document.getElementById("sens-label-" + channel);
    if (el) el.innerText = value + "% (opens at +" + sliderToParams(value).rf_open_threshold_db.toFixed(0) + " dB)";
  }

  function onSensitivityInput(channel, value) {
    updateSensitivityLabel(channel, value);
    clearTimeout(sensitivityDebounceTimers[channel]);
    sensitivityDebounceTimers[channel] = setTimeout(() => sendSensitivityUpdate(channel, value), 300);
  }

  async function sendSensitivityUpdate(channel, value) {
    try {
      await settingsFetch("/radio/" + channel + "/params", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(sliderToParams(value)),
      });
    } catch (err) { loadChannelSettings(); }   // refused: snap the slider back
  }

  async function loadChannelSettings() {
    for (const key of channelOrder) {
      try {
        const d = await (await fetch("/radio/" + key + "/params?x=" + Date.now())).json();
        const slider = document.querySelector(`.sensitivity-slider[data-channel="${key}"]`);
        if (slider && typeof d.rf_open_threshold_db === "number") {
          const pos = openThresholdToSlider(d.rf_open_threshold_db);
          slider.value = pos;
          updateSensitivityLabel(key, pos);
        }
      } catch (err) {}
    }
  }

  // A stream can end (pipeline restarted, network blip) without the radio's
  // selection changing; reconnect once a second later if we still want audio.
  function reconnectSoon() {
    if (!wantAudio || !audio.getAttribute("src")) return;
    setTimeout(() => { if (wantAudio && (audio.ended || audio.error)) syncAudio(true); }, 1000);
  }
  audio.onerror = reconnectSoon;
  audio.onended = reconnectSoon;

  // ---------- startup ----------

  (async function init() {
    buildGrid();
    loadScanChannels();
    loadChannelSettings();
    loadActivity();
    setInterval(loadActivity, 20000);
    setInterval(renderLastHeard, 30000);
    await pollStatus();
    setInterval(pollStatus, 2000);
  })();
</script>
</body>
</html>
