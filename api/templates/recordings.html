<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>Nava VHF · Recordings</title>
  <style>
    /* Same palette as player.html - keep the two in sync. */
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: #0f1f36;
      --panel-2: #132845;
      --line: #1f3b60;
      --text: #e6eef8;
      --muted: #8aa0b8;
      --cyan: #4fd1ff;
      --amber: #ffb547;
      --green: #4ade80;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 0 14px 40px; }

    .hero {
      position: relative; height: 120px; max-width: 640px; margin: 0 auto;
      background:
        linear-gradient(180deg, rgba(7,17,31,0.2) 0%, rgba(7,17,31,0.7) 70%, var(--bg) 100%),
        url("/radio/static/hero.jpg") center 38% / cover no-repeat,
        radial-gradient(ellipse at 70% 20%, #1b3b6b 0%, #0b1d3a 45%, var(--bg) 100%);
    }
    .hero-bar {
      position: absolute; left: 16px; right: 16px; bottom: 12px;
      display: flex; align-items: flex-end; justify-content: space-between;
    }
    .title { font-size: 22px; font-weight: 800; letter-spacing: 0.04em; text-shadow: 0 2px 12px rgba(0,0,0,0.6); }
    .title small { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.18em; color: var(--muted); }
    .brand small.tagline, .title small.tagline { font-style: italic; letter-spacing: 0.03em; font-size: 13px; font-weight: 500; color: #b9c8da; margin-top: 3px; }
    .back {
      color: var(--cyan); text-decoration: none; font-size: 14px; font-weight: 600;
      padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; background: rgba(7,17,31,0.75);
    }

    .filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 6px; }
    .chip {
      font: inherit; font-size: 14px; font-weight: 700; font-family: var(--mono);
      color: var(--muted); background: var(--panel); border: 1px solid var(--line);
      border-radius: 999px; padding: 7px 12px; cursor: pointer;
    }
    .chip.active { color: var(--bg); background: var(--cyan); border-color: var(--cyan); }
    .summary { color: var(--muted); font-size: 13px; margin: 6px 2px 0; }

    .day {
      font-size: 12px; letter-spacing: 0.18em; color: var(--muted); font-weight: 700;
      margin: 22px 2px 8px; display: flex; justify-content: space-between;
    }
    .day span:last-child { letter-spacing: 0.05em; font-weight: 600; }
    .clips { display: flex; flex-direction: column; gap: 6px; }
    .clip { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
    .clip.playing { border-color: var(--cyan); box-shadow: 0 0 14px rgba(79,209,255,0.18); }
    .clip-row { display: flex; align-items: center; gap: 10px; }
    .clip-play {
      flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--cyan);
      background: transparent; color: var(--cyan); font-size: 14px; cursor: pointer;
    }
    .clip.playing .clip-play { background: var(--cyan); color: var(--bg); }
    .clip-main { flex: 1; min-width: 0; }
    .clip-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .clip-title .t { font-family: var(--mono); color: var(--cyan); margin-right: 6px; }
    .clip-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .sig { font-family: var(--mono); font-size: 12px; flex: none; text-align: right; }
    .sig small { display: block; color: var(--muted); font-family: inherit; font-size: 10px; letter-spacing: 0.08em; }
    .sig.weak { color: var(--amber); } .sig.good { color: var(--cyan); } .sig.strong { color: var(--green); }
    .dl { flex: none; color: var(--muted); text-decoration: none; font-size: 16px; padding: 4px; }

    .progress { display: none; height: 18px; margin-top: 8px; cursor: pointer; position: relative; }
    .clip.playing .progress { display: block; }
    .progress::before {
      content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 4px;
      background: var(--line); border-radius: 2px;
    }
    .bar { position: absolute; left: 0; top: 7px; height: 4px; width: 0; background: var(--cyan); border-radius: 2px; }

    .empty { color: var(--muted); font-size: 14px; padding: 24px 2px; text-align: center; }
  </style>
</head>
<body>
  <div class="hero">
    <div class="hero-bar">
      <div class="title">Recordings<small class="tagline">Live from onboard SV Nava</small></div>
      <a class="back" href="/radio/player">← Player</a>
    </div>
  </div>

  <div class="wrap">
    <div id="filters" class="filters"></div>
    <div id="summary" class="summary">Loading…</div>
    <div id="list"></div>
  </div>

  <audio id="clipAudio" preload="none"></audio>

<script>
  const channels = __CHANNELS__;
  const channelOrder = __CHANNEL_ORDER__;   // explicit: Object.keys() would sort "13" before "09"
  const clipAudio = document.getElementById("clipAudio");
  let filter = null;
  let playingSrc = null;

  function label(key) { return key === "wx" ? "WX" : key; }
  function shortName(key) {
    const n = (channels[key] || {}).name || "";
    const m = n.match(/^Channel\s+\S+\s*-\s*(.+)$/);
    if (m) return m[1];
    return /^Channel\s+\S+$/.test(n) ? "" : n;
  }
  function sigClass(db) { return db === null ? "" : db < 15 ? "weak" : db < 30 ? "good" : "strong"; }
  function sigWord(db) { return db === null ? "" : db < 15 ? "WEAK" : db < 30 ? "GOOD" : "STRONG"; }

  function ago(ts) {
    const s = Math.max(0, Date.now() / 1000 - ts);
    if (s < 60) return "just now";
    if (s < 3600) return Math.round(s / 60) + " min ago";
    if (s < 86400) return Math.round(s / 3600) + " h ago";
    return Math.round(s / 86400) + " d ago";
  }

  function dayLabel(isoDay) {
    const d = new Date(isoDay + "T12:00:00");
    const today = new Date(); today.setHours(12, 0, 0, 0);
    const diff = Math.round((today - d) / 86400000);
    if (diff === 0) return "TODAY";
    if (diff === 1) return "YESTERDAY";
    return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }).toUpperCase();
  }

  function renderFilters() {
    const keys = [null, ...channelOrder];
    const el = document.getElementById("filters");
    el.innerHTML = keys.map(k =>
      `<button class="chip ${k === filter ? "active" : ""}" data-k="${k ?? ""}">${k === null ? "ALL" : label(k)}</button>`
    ).join("");
    el.querySelectorAll(".chip").forEach(b => b.onclick = () => {
      filter = b.dataset.k || null; renderFilters(); load();
    });
  }

  async function load() {
    const url = "/radio/recordings?limit=1000" + (filter ? "&channel=" + filter : "") + "&x=" + Date.now();
    let clips;
    try { clips = await (await fetch(url)).json(); } catch (e) { return; }
    const total = clips.reduce((a, c) => a + c.duration_s, 0);
    const mins = total >= 60 ? Math.floor(total / 60) + " min " + Math.round(total % 60) + " s" : Math.round(total) + " s";
    document.getElementById("summary").innerText = clips.length
      ? `${clips.length} transmission${clips.length === 1 ? "" : "s"} · ${mins} of audio · kept 30 days`
      : "";

    if (!clips.length) {
      document.getElementById("list").innerHTML =
        `<div class="empty">No transmissions recorded${filter ? " on " + label(filter) : ""} yet.<br>
         They appear here automatically whenever the squelch opens.</div>`;
      return;
    }

    // group by day, keeping newest-first order
    const days = [];
    for (const c of clips) {
      const d = c.time.slice(0, 10);
      if (!days.length || days[days.length - 1].day !== d) days.push({ day: d, clips: [] });
      days[days.length - 1].clips.push(c);
    }
    document.getElementById("list").innerHTML = days.map(g => `
      <div class="day"><span>${dayLabel(g.day)}</span><span>${g.clips.length}</span></div>
      <div class="clips">${g.clips.map(c => {
        const src = "/radio/recordings/file/" + c.path;
        const name = shortName(c.channel);
        return `
        <div class="clip ${src === playingSrc ? "playing" : ""}" data-src="${src}">
          <div class="clip-row">
            <button class="clip-play" onclick="togglePlay(this)">${src === playingSrc && !clipAudio.paused ? "❚❚" : "▶"}</button>
            <div class="clip-main">
              <div class="clip-title"><span class="t">${c.time.slice(11, 16)}</span>Ch ${label(c.channel)}${name ? " · " + name : ""}</div>
              <div class="clip-sub">${ago(c.ts)} · ${c.duration_s.toFixed(1)} s</div>
            </div>
            <div class="sig ${sigClass(c.peak_rf_snr_db)}">${c.peak_rf_snr_db === null ? "" : "+" + c.peak_rf_snr_db + " dB<small>" + sigWord(c.peak_rf_snr_db) + "</small>"}</div>
            <a class="dl" href="${src}" download title="Download">⤓</a>
          </div>
          <div class="progress" onclick="seek(event, this)"><div class="bar"></div></div>
        </div>`;
      }).join("")}</div>`).join("");
  }

  function resetRows() {
    document.querySelectorAll(".clip").forEach(r => {
      r.classList.remove("playing");
      r.querySelector(".clip-play").innerText = "▶";
      r.querySelector(".bar").style.width = "0";
    });
  }

  function togglePlay(btn) {
    const row = btn.closest(".clip");
    const src = row.dataset.src;
    if (src === playingSrc) {
      if (clipAudio.paused) { clipAudio.play(); btn.innerText = "❚❚"; }
      else { clipAudio.pause(); btn.innerText = "▶"; }
      return;
    }
    resetRows();
    playingSrc = src;
    clipAudio.src = src;
    row.classList.add("playing");
    clipAudio.play().then(() => { btn.innerText = "❚❚"; }).catch(() => {});
  }

  function seek(ev, el) {
    if (!clipAudio.duration) return;
    const r = el.getBoundingClientRect();
    clipAudio.currentTime = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)) * clipAudio.duration;
  }

  clipAudio.ontimeupdate = () => {
    const row = document.querySelector(".clip.playing");
    if (row && clipAudio.duration) row.querySelector(".bar").style.width = (100 * clipAudio.currentTime / clipAudio.duration) + "%";
  };
  clipAudio.onended = () => { playingSrc = null; resetRows(); };

  renderFilters();
  load();
  // Pick up new transmissions, but never redraw under a clip that's playing.
  setInterval(() => { if (clipAudio.paused) load(); }, 30000);
</script>
</body>
</html>
