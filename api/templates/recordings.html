<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>Nava VHF · Recordings</title>
  <style>
    /* Same palette as player.html - keep the two in sync. */
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: #0f1f36;
      --panel-2: #132845;
      --line: #1f3b60;
      --text: #e6eef8;
      --muted: #8aa0b8;
      --cyan: #4fd1ff;
      --amber: #ffb547;
      --green: #4ade80;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 0 14px 40px; }

    .hero {
      position: relative; height: 120px; max-width: 640px; margin: 0 auto;
      background:
        linear-gradient(180deg, rgba(7,17,31,0.2) 0%, rgba(7,17,31,0.7) 70%, var(--bg) 100%),
        url("/radio/static/hero.jpg") center 38% / cover no-repeat,
        radial-gradient(ellipse at 70% 20%, #1b3b6b 0%, #0b1d3a 45%, var(--bg) 100%);
    }
    .hero-bar {
      position: absolute; left: 16px; right: 16px; bottom: 12px;
      display: flex; align-items: flex-end; justify-content: space-between;
    }
    .title { font-size: 22px; font-weight: 800; letter-spacing: 0.04em; text-shadow: 0 2px 12px rgba(0,0,0,0.6); }
    .title small { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.18em; color: var(--muted); }
    .brand .place, .title .place {
      display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.2em;
      color: var(--cyan); margin-bottom: 4px; text-shadow: 0 1px 8px rgba(0,0,0,0.8);
    }
    .brand small.tagline, .title small.tagline { font-style: italic; letter-spacing: 0.03em; font-size: 13px; font-weight: 500; color: #b9c8da; margin-top: 3px; }
    .back {
      color: var(--cyan); text-decoration: none; font-size: 14px; font-weight: 600;
      padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; background: rgba(7,17,31,0.75);
    }

    .filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 6px; }
    .chip {
      font: inherit; font-size: 14px; font-weight: 700; font-family: var(--mono);
      color: var(--muted); background: var(--panel); border: 1px solid var(--line);
      border-radius: 999px; padding: 7px 12px; cursor: pointer;
    }
    .chip.active { color: var(--bg); background: var(--cyan); border-color: var(--cyan); }
    .summary { color: var(--muted); font-size: 13px; margin: 6px 2px 0; }

    .day {
      font-size: 12px; letter-spacing: 0.18em; color: var(--muted); font-weight: 700;
      margin: 22px 2px 8px; display: flex; justify-content: space-between;
    }
    .day span:last-child { letter-spacing: 0.05em; font-weight: 600; }
    .clips { display: flex; flex-direction: column; gap: 8px; }

    /* conversation card: same-channel transmissions close together */
    .convo { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .convo.active { border-color: var(--cyan); box-shadow: 0 0 14px rgba(79,209,255,0.18); }
    .convo-head { display: flex; align-items: center; gap: 10px; padding: 10px; }
    .convo-play {
      flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--cyan);
      background: transparent; color: var(--cyan); font-size: 15px; cursor: pointer;
    }
    .convo.active .convo-play { background: var(--cyan); color: var(--bg); }
    .convo-main { flex: 1; min-width: 0; }
    .convo-title { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .convo-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    /* a lone transmission: one compact row instead of header + row */
    .convo.single .convo-head { display: none; }
    .convo.single .msgs { border-top: none; }
    .convo.single .clip { padding: 9px 10px 9px 12px; }
    .convo.single .clip-play { width: 40px; height: 40px; font-size: 14px; }
    .clip-title .ch { font-weight: 700; margin-right: 6px; }
    .clip-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .badge { flex: none; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--cyan);
             color: var(--bg); font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; }
    .badge[hidden] { display: none; }
    .msgs { border-top: 1px solid var(--line); }
    .msgs .clip { border: none; border-radius: 0; background: transparent; border-top: 1px solid rgba(31,59,96,0.5); padding: 7px 10px 7px 12px; }
    .msgs .clip:first-child { border-top: none; }
    .msgs .clip.playing { box-shadow: none; background: rgba(79,209,255,0.06); }
    .msgs .clip-play { width: 32px; height: 32px; font-size: 12px; }
    .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: transparent; }
    .clip.unheard .dot { background: var(--cyan); }
    .clip.unheard .clip-title { color: var(--text); }
    .clip:not(.unheard) .clip-title { color: #b9c8da; font-weight: 500; }
    .chip.unheard-chip { margin-left: auto; }
    .summary-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 6px 2px 0; }
    .summary-row .summary { margin: 0; }
    .linkbtn { font: inherit; font-size: 13px; color: var(--cyan); background: none; border: none; cursor: pointer; padding: 0; white-space: nowrap; }
    .linkbtn[hidden] { display: none; }
    .searchbox { margin-top: 12px; }
    .searchbox input { width: 100%; font: inherit; font-size: 15px; color: var(--text); background: var(--panel);
      border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none; }
    .searchbox input:focus { border-color: var(--cyan); }
    .tx { font-size: 13px; line-height: 1.4; color: #c9d6e6; margin: 4px 0 2px 50px; cursor: pointer;
          display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .tx.open { -webkit-line-clamp: unset; display: block; }
    .tx.pending, .tx.none { color: var(--muted); font-style: italic; cursor: default; }
    .tx mark { background: rgba(79,209,255,0.25); color: var(--text); border-radius: 3px; padding: 0 2px; }
    .vtags { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px 50px; }
    .vtag { font-size: 12px; font-weight: 700; color: var(--cyan); text-decoration: none; border: 1px solid rgba(79,209,255,0.5);
            border-radius: 999px; padding: 2px 8px; }
    .clip { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
    .clip.playing { border-color: var(--cyan); box-shadow: 0 0 14px rgba(79,209,255,0.18); }
    .clip-row { display: flex; align-items: center; gap: 10px; }
    .clip-play {
      flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--cyan);
      background: transparent; color: var(--cyan); font-size: 14px; cursor: pointer;
    }
    .clip.playing .clip-play { background: var(--cyan); color: var(--bg); }
    .clip-main { flex: 1; min-width: 0; }
    .clip-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .clip-title .t { font-family: var(--mono); color: var(--cyan); margin-right: 6px; }
    .clip-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .sig { font-family: var(--mono); font-size: 12px; flex: none; text-align: right; }
    .sig small { display: block; color: var(--muted); font-family: inherit; font-size: 10px; letter-spacing: 0.08em; }
    .sig.weak { color: var(--amber); } .sig.good { color: var(--cyan); } .sig.strong { color: var(--green); }
    .dl { flex: none; color: var(--muted); text-decoration: none; font-size: 16px; padding: 4px; }

    .progress { display: none; height: 18px; margin-top: 8px; cursor: pointer; position: relative; }
    .clip.playing .progress { display: block; }
    .progress::before {
      content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 4px;
      background: var(--line); border-radius: 2px;
    }
    .bar { position: absolute; left: 0; top: 7px; height: 4px; width: 0; background: var(--cyan); border-radius: 2px; }

    .empty { color: var(--muted); font-size: 14px; padding: 24px 2px; text-align: center; }
  </style>
</head>
<body>
  <div class="hero">
    <div class="hero-bar">
      <div class="title"><span class="place">ST. AUGUSTINE, FL</span>Recordings<small class="tagline">Live from onboard SV Nava</small></div>
      <a class="back" href="/radio/player">← Player</a>
    </div>
  </div>

  <div class="wrap">
    <div class="searchbox"><input id="search" type="search" placeholder="Search what was said… (e.g. opening, mooring, Sea Angel)" autocomplete="off" enterkeyhint="search"></div>
    <div id="filters" class="filters"></div>
    <div class="summary-row">
      <div id="summary" class="summary">Loading…</div>
      <button id="markAll" class="linkbtn" onclick="markAllHeard()" hidden>Mark all heard</button>
    </div>
    <div id="list"></div>
  </div>

  <audio id="clipAudio" preload="none"></audio>

<script>
  const channels = __CHANNELS__;
  const channelOrder = __CHANNEL_ORDER__;   // explicit: Object.keys() would sort "13" before "09"
  const clipAudio = document.getElementById("clipAudio");
  const CONVO_GAP_S = 120;   // same channel, next transmission starts within 2 min of the last one ending
  let filter = null;
  let unheardOnly = false;
  let clips = [];             // newest-first from the server
  let queue = [];             // paths still to play, in order
  let playingPath = null;

  function label(key) { return key === "wx" ? "WX" : key; }
  function shortName(key) {
    const n = (channels[key] || {}).name || "";
    const m = n.match(/^Channel\s+\S+\s*-\s*(.+)$/);
    if (m) return m[1];
    return /^Channel\s+\S+$/.test(n) ? "" : n;
  }
  function sigClass(db) { return db === null ? "" : db < 15 ? "weak" : db < 30 ? "good" : "strong"; }
  function sigWord(db) { return db === null ? "" : db < 15 ? "WEAK" : db < 30 ? "GOOD" : "STRONG"; }

  function ago(ts) {
    const s = Math.max(0, Date.now() / 1000 - ts);
    if (s < 60) return "just now";
    if (s < 3600) return Math.round(s / 60) + " min ago";
    if (s < 86400) return Math.round(s / 3600) + " h ago";
    return Math.round(s / 86400) + " d ago";
  }

  function dayLabel(isoDay) {
    const d = new Date(isoDay + "T12:00:00");
    const today = new Date(); today.setHours(12, 0, 0, 0);
    const diff = Math.round((today - d) / 86400000);
    if (diff === 0) return "TODAY";
    if (diff === 1) return "YESTERDAY";
    return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }).toUpperCase();
  }

  function renderFilters() {
    const el = document.getElementById("filters");
    el.replaceChildren();
    for (const k of [null, ...channelOrder]) {
      const b = document.createElement("button");
      b.className = "chip" + (k === filter ? " active" : "");
      b.textContent = k === null ? "ALL" : label(k);
      b.onclick = () => { filter = k; renderFilters(); load(); };
      el.appendChild(b);
    }
    const u = document.createElement("button");
    const n = clips.filter(c => !c.listened).length;
    u.className = "chip unheard-chip" + (unheardOnly ? " active" : "");
    u.textContent = "UNHEARD" + (n ? " " + n : "");
    u.onclick = () => { unheardOnly = !unheardOnly; renderFilters(); render(); };
    el.appendChild(u);
  }

  // Search term highlighting, built from text nodes (transcripts are untrusted text).
  function highlight(elm, text) {
    const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) { elm.textContent = text; return; }
    const re = new RegExp("(" + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
    for (const part of text.split(re)) {
      if (!part) continue;
      if (terms.includes(part.toLowerCase())) elm.appendChild(el("mark", null, part));
      else elm.appendChild(document.createTextNode(part));
    }
  }

  let query = "", searchTimer = null, sttStatus = null;
  document.getElementById("search").addEventListener("input", ev => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { query = ev.target.value.trim(); load(); }, 350);
  });

  async function load() {
    const url = "/radio/recordings?limit=1000" + (filter ? "&channel=" + filter : "") + (query ? "&q=" + encodeURIComponent(query) : "") + "&x=" + Date.now();
    try { clips = await (await fetch(url)).json(); } catch (e) { return; }
    try { sttStatus = await (await fetch("/radio/recordings/stt-status?x=" + Date.now())).json(); } catch (e) {}
    renderFilters();
    render();
  }

  // Group into conversations: oldest -> newest, same channel and day, a gap of
  // at most CONVO_GAP_S between one transmission's end and the next's start.
  function conversations(list) {
    const asc = [...list].sort((a, b) => a.ts - b.ts);
    const out = [];
    for (const c of asc) {
      const cur = out[out.length - 1];
      const prev = cur && cur.clips[cur.clips.length - 1];
      if (prev && prev.channel === c.channel && prev.time.slice(0, 10) === c.time.slice(0, 10)
          && c.ts - (prev.ts + prev.duration_s) <= CONVO_GAP_S) cur.clips.push(c);
      else out.push({ channel: c.channel, clips: [c] });
    }
    return out.reverse();   // newest conversation first
  }

  function fmtDur(s) { s = Math.round(s); return s >= 60 ? Math.floor(s / 60) + " min " + (s % 60) + " s" : s + " s"; }
  function srcOf(path) { return "/radio/recordings/file/" + path; }
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function render() {
    const list = document.getElementById("list");
    const total = clips.reduce((a, c) => a + c.duration_s, 0);
    const unheard = clips.filter(c => !c.listened);
    document.getElementById("summary").textContent = (clips.length
      ? `${clips.length} ${query ? "match" + (clips.length === 1 ? "" : "es") : "transmission" + (clips.length === 1 ? "" : "s")} · ${fmtDur(total)} · ${unheard.length} unheard`
      : "") + (sttStatus && sttStatus.enabled && sttStatus.pending ? ` · transcribing ${sttStatus.pending} clip${sttStatus.pending === 1 ? "" : "s"}…` : "");
    document.getElementById("markAll").hidden = !unheard.length;

    let convos = conversations(clips);
    if (unheardOnly) convos = convos.filter(cv => cv.clips.some(c => !c.listened));
    list.replaceChildren();
    if (!convos.length) {
      const e = el("div", "empty");
      e.textContent = query ? `Nothing said matches "${query}"` + (sttStatus && sttStatus.pending ? " yet - some clips are still being transcribed." : ".") :
        unheardOnly ? "You're all caught up - nothing unheard." :
        `No transmissions recorded${filter ? " on " + label(filter) : ""} yet. They appear here automatically whenever the squelch opens.`;
      list.appendChild(e);
      return;
    }

    let day = null, box = null;
    for (const cv of convos) {
      const first = cv.clips[0], last = cv.clips[cv.clips.length - 1];
      const d = first.time.slice(0, 10);
      if (d !== day) {
        day = d;
        const n = convos.filter(x => x.clips[0].time.slice(0, 10) === d).length;
        const h = el("div", "day"); h.append(el("span", null, dayLabel(d)), el("span", null, n + (n === 1 ? " conversation" : " conversations")));
        list.appendChild(h);
        box = el("div", "clips"); list.appendChild(box);
      }
      const card = el("div", "convo");
      card.dataset.paths = JSON.stringify(cv.clips.map(c => c.path));

      const head = el("div", "convo-head");
      const play = el("button", "convo-play", "▶");
      play.title = "Play conversation";
      play.onclick = () => playConversation(card);
      const main = el("div", "convo-main");
      const name = shortName(cv.channel);
      main.append(el("div", "convo-title", "Ch " + label(cv.channel) + (name ? " · " + name : "")));
      const span = first.time.slice(11, 16) + (cv.clips.length > 1 && last.time.slice(11, 16) !== first.time.slice(11, 16) ? "–" + last.time.slice(11, 16) : "");
      const dur = cv.clips.reduce((a, c) => a + c.duration_s, 0);
      main.append(el("div", "convo-sub", `${span} · ${cv.clips.length} transmissions · ${fmtDur(dur)} · ${ago(last.ts)}`));
      const badge = el("span", "badge");
      head.append(play, main, badge);

      if (cv.clips.length === 1) card.classList.add("single");
      const msgs = el("div", "msgs");
      for (const c of cv.clips) msgs.appendChild(clipRow(c, card, cv.clips.length === 1));
      card.append(head, msgs);
      box.appendChild(card);
      updateBadge(card);
    }
    syncPlayingUI();
  }

  function clipRow(c, card, standalone) {
    const row = el("div", "clip" + (c.listened ? "" : " unheard"));
    row.dataset.path = c.path;
    const r = el("div", "clip-row");
    const btn = el("button", "clip-play", "▶");
    btn.onclick = () => playFrom(card, c.path);
    const main = el("div", "clip-main");
    const title = el("div", "clip-title");
    if (standalone) {
      const name = shortName(c.channel);
      title.append(el("span", "ch", "Ch " + label(c.channel)), document.createTextNode(name ? "· " + name : ""));
      main.append(title, el("div", "clip-meta", `${c.time.slice(11, 19)} · ${c.duration_s.toFixed(1)} s · ${ago(c.ts)}`));
    } else {
      title.append(el("span", "t", c.time.slice(11, 19)), document.createTextNode(c.duration_s.toFixed(1) + " s"));
      main.append(title);
    }
    const sig = el("div", "sig " + sigClass(c.peak_rf_snr_db));
    if (c.peak_rf_snr_db !== null) { sig.textContent = "+" + c.peak_rf_snr_db + " dB"; sig.appendChild(el("small", null, sigWord(c.peak_rf_snr_db))); }
    const dl = el("a", "dl", "⤓"); dl.href = srcOf(c.path); dl.setAttribute("download", ""); dl.title = "Download";
    r.append(el("span", "dot"), btn, main, sig, dl);
    const prog = el("div", "progress"); prog.onclick = ev => seek(ev, prog); prog.appendChild(el("div", "bar"));
    row.append(r);
    if (c.transcript === null || c.transcript === undefined) row.appendChild(el("div", "tx pending", "transcribing…"));
    else if (!c.transcript) row.appendChild(el("div", "tx none", "(no speech recognised)"));
    else {
      const tx = el("div", "tx");
      highlight(tx, c.transcript);
      tx.onclick = () => tx.classList.toggle("open");
      row.appendChild(tx);
    }
    if (c.vessels && c.vessels.length) {
      const tags = el("div", "vtags");
      for (const v of c.vessels) {
        const a = el("a", "vtag", "⚓ " + v.name);
        a.href = "/radio/ais/view#mmsi=" + encodeURIComponent(v.mmsi);
        a.title = "Name heard in the audio - show on the ship map";
        tags.appendChild(a);
      }
      row.appendChild(tags);
    }
    row.appendChild(prog);
    return row;
  }

  function updateBadge(card) {
    const n = card.querySelectorAll(".clip.unheard").length;
    const b = card.querySelector(".badge");
    b.textContent = n; b.hidden = !n;
  }

  // ---------- playback: WhatsApp-style, plays on through the conversation ----------

  function pathsOf(card) { return JSON.parse(card.dataset.paths); }
  function isHeard(path) { const c = clips.find(x => x.path === path); return c ? c.listened : true; }
  function cardOf(path) { return [...document.querySelectorAll(".convo")].find(cd => pathsOf(cd).includes(path)); }

  function playConversation(card) {
    const paths = pathsOf(card);
    if (playingPath && paths.includes(playingPath)) { togglePause(); return; }
    const firstUnheard = paths.findIndex(p => !isHeard(p));
    startQueue(paths.slice(firstUnheard < 0 ? 0 : firstUnheard));
  }

  function playFrom(card, path) {
    if (path === playingPath) { togglePause(); return; }
    const paths = pathsOf(card), i = paths.indexOf(path);
    // play this one, then carry on through any unheard ones after it
    startQueue([path, ...paths.slice(i + 1).filter(p => !isHeard(p))]);
  }

  function togglePause() { if (clipAudio.paused) clipAudio.play().catch(() => {}); else clipAudio.pause(); syncPlayingUI(); }

  function startQueue(paths) { queue = paths.slice(1); playPath(paths[0]); }

  function playPath(path) {
    playingPath = path;
    markedThis = false;
    clipAudio.src = srcOf(path);
    clipAudio.play().catch(() => {});
    syncPlayingUI();
    const row = document.querySelector(`.clip[data-path="${CSS.escape(path)}"]`);
    if (row) row.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  function syncPlayingUI() {
    document.querySelectorAll(".clip").forEach(r => {
      const on = r.dataset.path === playingPath;
      r.classList.toggle("playing", on);
      r.querySelector(".clip-play").textContent = on && !clipAudio.paused ? "❚❚" : "▶";
      if (!on) r.querySelector(".bar").style.width = "0";
    });
    const active = playingPath ? cardOf(playingPath) : null;
    document.querySelectorAll(".convo").forEach(cd => {
      const on = cd === active;
      cd.classList.toggle("active", on);
      cd.querySelector(".convo-play").textContent = on && !clipAudio.paused ? "❚❚" : "▶";
    });
  }

  let markedThis = false;
  async function markHeard(paths) {
    paths = paths.filter(p => !isHeard(p));
    if (!paths.length) return;
    for (const c of clips) if (paths.includes(c.path)) c.listened = true;
    for (const p of paths) {
      const row = document.querySelector(`.clip[data-path="${CSS.escape(p)}"]`);
      if (row) { row.classList.remove("unheard"); updateBadge(row.closest(".convo")); }
    }
    renderFilters();
    const n = clips.filter(c => !c.listened).length;
    document.getElementById("markAll").hidden = !n;
    document.getElementById("summary").textContent = document.getElementById("summary").textContent.replace(/\d+ unheard$/, n + " unheard");
    try {
      await fetch("/radio/recordings/listened", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ paths }) });
    } catch (e) {}
  }

  function markAllHeard() { markHeard(clips.map(c => c.path)); }

  function seek(ev, prog) {
    const row = prog.closest(".clip");
    if (row.dataset.path !== playingPath || !clipAudio.duration) return;
    const r = prog.getBoundingClientRect();
    clipAudio.currentTime = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)) * clipAudio.duration;
  }

  clipAudio.ontimeupdate = () => {
    if (!playingPath || !clipAudio.duration) return;
    const row = document.querySelector(`.clip[data-path="${CSS.escape(playingPath)}"]`);
    if (row) row.querySelector(".bar").style.width = (100 * clipAudio.currentTime / clipAudio.duration) + "%";
    // "heard" = played to (nearly) the end, not merely started
    if (!markedThis && clipAudio.currentTime / clipAudio.duration >= 0.9) { markedThis = true; markHeard([playingPath]); }
  };
  clipAudio.onended = () => {
    if (!markedThis && playingPath) markHeard([playingPath]);
    if (queue.length) { const next = queue.shift(); setTimeout(() => playPath(next), 350); }
    else { playingPath = null; syncPlayingUI(); }
  };
  clipAudio.onpause = clipAudio.onplay = syncPlayingUI;

  renderFilters();
  load();
  // Pick up new transmissions, but never redraw under a clip that's playing.
  setInterval(() => { if (clipAudio.paused) load(); }, 30000);
</script>
</body>
</html>
